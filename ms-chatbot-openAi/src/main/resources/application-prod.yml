spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/monify
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: admin
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect


server:
  port: 8082

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
