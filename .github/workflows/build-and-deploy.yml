name: Continuous Integration and Delivery with Github Actions
on:
  push:
    branches:
      - "developer"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN}}

      - name: Setup Java 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Docker Compose Build
        run: docker compose build

      - name: Push to Docker Hub Container Registry
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/monify-ms-users:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/monify-ms-chatbot-openai:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/monify-ms-finance-monify:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/monify-ms-monify-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/monify-ms-whatsapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/monify-eureka-server:latest
